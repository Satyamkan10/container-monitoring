apiVersion: 1

# Provisioning files support env interpolation, so templates use .Labels (not $labels).
groups:
  - orgId: 1
    name: container-pids
    folder: Container Alerts
    interval: 1m
    rules:
      - uid: pid-trend-up
        title: Container PID count rising
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: PROM
            model:
              refId: A
              # PIDs gained per container over the last 30 minutes
              expr: netdata_cgroup_pids_current_pids_average - (netdata_cgroup_pids_current_pids_average offset 30m)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ .Labels.cgroup_name }} gained more than 50 processes in 30 minutes'
          description: 'Possible process/PID leak in container {{ .Labels.cgroup_name }}.'

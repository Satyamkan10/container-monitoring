global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Per-container metrics from Netdata (host network, reached via host-gateway)
  - job_name: netdata
    metrics_path: /api/v1/allmetrics
    params:
      format: [prometheus]
      filter: ['cgroup_*']
    static_configs:
      - targets: ['host.docker.internal:19999']
    # keep only the 3 metric families the dashboard/alerts use (low cardinality)
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'netdata_cgroup_(cpu_percentage|mem_usage_MiB|pids_current_pids)_average'
        action: keep

  # Host CPU / RAM / swap / disk
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
